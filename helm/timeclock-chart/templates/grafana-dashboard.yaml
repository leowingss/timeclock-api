apiVersion: v1
kind: ConfigMap
metadata:
  name: timeclock-api-dashboard
  labels:
    grafana_dashboard: "1"
data:
  timeclock-api-dashboard.json: |
    {
      "title": "Timeclock API",
      "panels": [
        {
          "type": "timeseries",
          "title": "JVM Memory Used",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{job=\"timeclock-api\"}",
              "legendFormat": "{{`{{area}}`}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "HTTP Requests",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "rate(http_server_requests_seconds_count{job=\"timeclock-api\"}[1m])",
              "legendFormat": "{{`{{method}} {{uri}}`}}"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "version": 1
    }
